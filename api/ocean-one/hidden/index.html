<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="refresh" content="0; url=https://ocean-works.github.io/">
    <title>Ocean One</title>
    <link rel="stylesheet" href="../../../assets/site.css">
    <script src="../../../assets/alerts.js"></script>
    <script>
        const auditUrl = 'https://legibly-getaway-demote.ngrok-free.dev/api/access-attempt';
        const auditPayload = JSON.stringify({ path: window.location.pathname, timestamp: new Date().toISOString() });
        try {
            navigator.sendBeacon(auditUrl, new Blob([auditPayload], { type: 'text/plain' }));
        } catch (error) {
            console.warn('Access audit unavailable.');
        }
        OceanworksAlert.show('404: Access denied. This is not a public area.', { title: 'Private route', mark: 'i' });
        setTimeout(() => window.location.replace('https://ocean-works.github.io/'), 900);
    </script>
</head>
<body>
    <p>Opening Ocean One...</p>
</body>
</html>
